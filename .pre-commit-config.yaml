repos:
  - repo: local
    hooks:
      - id: commit-msg
        name: Conventional commit message
        stages: [commit-msg]
        entry: 'python3 -c "import sys; msg = open(sys.argv[1]).read().strip(); import re; sys.exit(0) if re.match(r\"^(feat|fix|chore|docs|refactor|test|release)(\(.+\))?(!)?: .+\", msg) or msg == \"root: initialize Aqueduct project\" else sys.exit(print(f\"❌ Commit must match: type(scope): message\\nValid types: feat, fix, chore, docs, refactor, test, release\\nGot: {msg}\"))"'
        language: system
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.11
